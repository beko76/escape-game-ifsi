name: Veille IA quotidienne

on:
  schedule:
    # Tous les jours à 5 h 13 UTC (6 h 13 à Paris en hiver, 7 h 13 en été).
    - cron: "13 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: veille-ia
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: veille-ia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: veille-ia/package-lock.json
      - run: npm ci

      - name: Collecte et rédaction
        id: veille
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm start
          echo "jour=$(TZ=Europe/Paris date +%F)" >> "$GITHUB_OUTPUT"

      - name: Archivage du rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rapports
          git commit -m "Veille IA du ${{ steps.veille.outputs.jour }}"
          git pull --rebase
          git push

      - name: Publication en issue (notification par e-mail)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Veille IA du ${{ steps.veille.outputs.jour }}" \
            --body-file "rapports/${{ steps.veille.outputs.jour }}.md"
